[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoconnect"
version = "0.1.0"
description = "EcoConnectAI: satellite-driven coastal ecosystem connectivity and conservation decision support"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = {find = {include = ["ecoconnect*", "backend*"]}}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio.*"]
