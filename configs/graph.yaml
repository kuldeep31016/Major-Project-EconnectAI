# Graph construction and connectivity analysis parameters (paper Section IV-B/IV-C, Table IV).
# Every value here is a DESIGN PARAMETER, not a measurement. tau is species-relevant and
# must be calibrated per deployment (paper Section VI-F, VII).
graph:
  k_neighbors: 3                 # k nearest neighbours per patch (paper: k = 3)
  tau_km: 5.0                    # dispersal threshold tau; edges only if d_ij <= tau (paper: 5 km)
  distance_mode: haversine       # haversine (lat/lon centroids) | euclidean (planar km)
  tau_sensitivity_km: [3.0, 5.0, 8.0]   # thresholds re-run for the Section VI-F robustness check

connectivity:
  research_metric: iic           # C(G) used for criticality/what-if/restoration: iic | pc | largest_component
  pc_probability_at_tau: 0.5     # p_ij = exp(-alpha d), alpha fixed so p(tau) = this
  interface_score_weights:       # paper Eq. (7) - INTERFACE score only, never a research result
    structural: 0.30
    functional: 0.28
    quality: 0.22
    redundancy: 0.12
    protection: 0.08

criticality:
  level_thresholds: [0.25, 0.10, 0.03]   # S_i bands: critical / high / medium / low (presentation only)

restoration:
  candidate_source: sub_threshold  # sub_threshold | geojson | none
  candidate_threshold: 0.30        # pixels with candidate_threshold <= p < threshold form candidate sites
  candidate_min_area_ha: 1.0
  candidate_max_count: 12
  candidate_geojson: null          # path to user-provided candidate polygons (WGS84) when source = geojson
  cost_csv: null                   # OPTIONAL user-provided costs: columns candidate_id,cost. No costs shipped.
  cost_unit: null                  # e.g. "INR lakh"
  rebuild_edges_on_insert: false   # false = candidate links to its k nearest (paper/offline behaviour)

export:
  heatmap_cell_m: 300              # UI sensitivity grid cell size (presentation)
  polygon_simplify_m: 15           # geometry simplification for the web map
