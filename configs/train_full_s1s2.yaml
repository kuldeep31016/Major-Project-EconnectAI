# MODE B - CLOUD_TRAINING_MODE / FULL EXPERIMENT.  UNB7 exactly as in the paper.
# Intended for a CUDA GPU (Colab / Kaggle, >= 16 GB).  See notebooks/colab_train_unb7.ipynb.
mode: full
dataset_config: configs/dataset_s1s2.yaml

model:
  encoder: efficientnet-b7        # UNB7 (paper Section IV-A, Fig. 3)
  encoder_weights: imagenet

training:
  epochs: 60
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  loss: bce_dice
  loss_kwargs: {}
  scheduler: cosine
  early_stopping_patience: 10
  monitor: iou
  threshold: 0.5
  mixed_precision: true
  grad_clip: 1.0
  seed: 42
  device: auto
  max_train_batches_per_epoch: null

# override dataset settings for the full run
dataset_overrides:
  dataset: {image_size: 256}      # tiles are cut at 256 (scripts/build_tiles.py --tile); larger would only reflect-pad
  loader: {batch_size: 8, num_workers: 4, pin_memory: true}

output_root: outputs/segmentation
