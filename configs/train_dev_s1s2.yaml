# E3 ablation (S1+S2 fusion), MODE A.  Small real subset, small encoder, runs on a laptop (MPS/CPU).
# Results are labelled "DEVELOPMENT-SUBSET RESULT - NOT FINAL" and must never be reported as final.
mode: development
dataset_config: configs/dataset_s1s2.yaml

model:
  encoder: efficientnet-b0        # RESOURCE-DRIVEN dev encoder; architecture (U-Net + skips) identical to UNB7
  encoder_weights: imagenet       # null for fully offline runs

training:
  epochs: 15
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  loss: bce_dice
  loss_kwargs: {}
  scheduler: cosine               # cosine | plateau | none
  early_stopping_patience: 6
  monitor: iou                    # validation metric that selects best_model.pth
  threshold: 0.5                  # for validation metrics; SEGMENTATION_THRESHOLD in analysis is separate
  mixed_precision: true           # only takes effect on CUDA
  grad_clip: 1.0
  seed: 42
  device: auto                    # auto | cuda | mps | cpu
  max_train_batches_per_epoch: null   # set e.g. 5 for a one-minute smoke test

output_root: outputs/segmentation
