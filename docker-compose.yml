services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoconnect-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ECO_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost
      - ECO_DEMO_PASSWORD=${ECO_DEMO_PASSWORD:-demo1234}   # local only; override via .env
      - ECO_JWT_SECRET=${ECO_JWT_SECRET:-}
    volumes:
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # baked into the browser bundle: must be an address the *browser* can reach
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        BACKEND_URL: http://backend:8000
    container_name: ecoconnect-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
