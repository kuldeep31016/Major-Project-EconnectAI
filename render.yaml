# Render blueprint for the EcoConnectAI API (Dashboard -> New -> Blueprint -> this repo).
# The frontend is deployed separately (Vercel, root directory frontend/).
services:
  - type: web
    name: major-project-econnectai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ECO_JWT_SECRET
        generateValue: true
      - key: ECO_DEMO_PASSWORD
        value: demo1234
      - key: ECO_CORS_ORIGINS
        value: http://localhost:3000
      - key: ECO_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
